# Optional dev database (the scripts prefer an ephemeral initdb cluster and
# need no docker at all). Pinned to postgres:16 — same major as Neon prod.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
